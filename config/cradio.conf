CONFIG_ZMK_KEYBOARD_NAME="satans keyboard"
# Set deep sleep to 30 mins
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# fix weak bluetooth connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_INDICATOR_LED_WIDGET=y
CONFIG_INDICATOR_LED_SHOW_BATTERY_ON_BOOT=y
CONFIG_INDICATOR_LED_SHOW_BLE=n
CONFIG_INDICATOR_LED_SHOW_LAYER_CHANGE=n
CONFIG_INDICATOR_LED_BATTERY_LEVEL_LOW=20
CONFIG_INDICATOR_LED_BATTERY_LEVEL_CRITICAL=10
